site_name: ML Algorithm Handbook
site_description: Comprehensive ML, NLP and GenAI algorithm handbook - intuition, math, worked examples, code
docs_dir: ..
site_dir: ../../_handbook_site
exclude_docs: |
  .git/
  .gitignore
  mkdocs-site/
  notebooks/_build.py
theme:
  name: material
  features: [navigation.sections, navigation.top, navigation.indexes, search.suggest, content.code.copy]
  palette:
    - scheme: default
      toggle: {icon: material/weather-night, name: Dark mode}
    - scheme: slate
      toggle: {icon: material/weather-sunny, name: Light mode}
markdown_extensions:
  - tables
  - toc: {permalink: true}
  - pymdownx.arithmatex: {generic: true}
  - pymdownx.superfences
  - pymdownx.highlight
  - attr_list
extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
nav:
  - Home: README.md
  - Chapter template: TEMPLATE.md
  - Code index: code/README.md
  - 0 Foundations:
    - 00-foundations/01-math-essentials.md
    - 00-foundations/02-probability-mle-map.md
    - 00-foundations/03-optimization.md
    - 00-foundations/04-bias-variance-regularization.md
    - 00-foundations/05-evaluation.md
    - 00-foundations/06-feature-engineering.md
  - 1 Regression:
